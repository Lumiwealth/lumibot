<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lumibot Memory and Notifications</title>
  <desc id="desc">Agent decisions flow into local JSONL memory and optional Telegram notifications.</desc>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="50" y="60" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Memory, traceability, and notifications</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="125" width="260" height="170" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="105" y="170" font-size="22" font-weight="700" fill="#5b21b6">Agent decision</text>
    <text x="105" y="210" font-size="16" fill="#4c1d95">evidence</text>
    <text x="105" y="238" font-size="16" fill="#4c1d95">bull and bear cases</text>
    <text x="105" y="266" font-size="16" fill="#4c1d95">orders and rationale</text>
    <path d="M340 210 H445" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="455" y="95" width="280" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="490" y="140" font-size="22" font-weight="700" fill="#166534">Local memory</text>
    <text x="490" y="180" font-size="16" fill="#14532d">memories.jsonl</text>
    <text x="490" y="208" font-size="16" fill="#14532d">decisions.jsonl</text>
    <text x="490" y="236" font-size="16" fill="#14532d">lessons.jsonl</text>
    <text x="490" y="264" font-size="16" fill="#14532d">theses.jsonl</text>
    <path d="M745 210 H850" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="860" y="125" width="270" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="895" y="170" font-size="22" font-weight="700" fill="#1d4ed8">Notify user</text>
    <text x="895" y="210" font-size="16" fill="#1e3a8a">Telegram first</text>
    <text x="895" y="238" font-size="16" fill="#1e3a8a">backtests off by default</text>
    <text x="895" y="266" font-size="16" fill="#1e3a8a">BotSpot provider later</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
