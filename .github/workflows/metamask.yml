name: MetaMask Python broker

on:
  pull_request:
    paths:
      - "lumibot/tools/metamask/**"
      - "lumibot/tools/metamask_client.py"
      - "lumibot/brokers/metamask.py"
      - "lumibot/data_sources/metamask_data.py"
      - "lumibot/credentials.py"
      - "setup.py"
      - "tests/test_metamask*.py"
      - ".github/workflows/metamask.yml"
  push:
    branches: [dev, "version/**"]
    paths:
      - "lumibot/tools/metamask/**"
      - "lumibot/tools/metamask_client.py"
      - "lumibot/brokers/metamask.py"
      - "lumibot/data_sources/metamask_data.py"
      - "lumibot/credentials.py"
      - "setup.py"
      - "tests/test_metamask*.py"
      - ".github/workflows/metamask.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      LUMIBOT_DISABLE_DOTENV: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[metamask]' pytest ruff
      - run: python -m pip check
      - run: python -m ruff check lumibot/tools/metamask lumibot/tools/metamask_client.py lumibot/brokers/metamask.py lumibot/data_sources/metamask_data.py tests/test_metamask*.py
      - run: python -m ruff format --check lumibot/tools/metamask lumibot/tools/metamask_client.py lumibot/brokers/metamask.py lumibot/data_sources/metamask_data.py tests/test_metamask*.py
      - run: python -m pytest tests/test_metamask_broker.py tests/test_metamask_native*.py -q
