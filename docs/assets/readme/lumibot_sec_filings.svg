<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SEC Fundamentals and Filing Research</title>
  <desc id="desc">Lumibot agents can read SEC company facts, statements, filings, and cached filing text without future lookahead.</desc>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">SEC fundamentals, filings, and point-in-time cache</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="120" width="230" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="165" font-size="22" font-weight="700" fill="#0f172a">SEC EDGAR</text>
    <text x="95" y="205" font-size="16" fill="#334155">companyfacts</text>
    <text x="95" y="233" font-size="16" fill="#334155">submissions</text>
    <text x="95" y="261" font-size="16" fill="#334155">filing documents</text>
    <path d="M300 205 H405" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="415" y="110" width="270" height="190" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="450" y="155" font-size="22" font-weight="700" fill="#155e75">Lumibot cache</text>
    <text x="450" y="195" font-size="16" fill="#155e75">mandatory local files</text>
    <text x="450" y="223" font-size="16" fill="#155e75">rate limited requests</text>
    <text x="450" y="251" font-size="16" fill="#155e75">no repeated backtest hits</text>
    <path d="M695 205 H800" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="810" y="90" width="330" height="230" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="845" y="135" font-size="22" font-weight="700" fill="#854d0e">Agent tools</text>
    <text x="845" y="175" font-size="16" fill="#713f12">get_income_statement</text>
    <text x="845" y="203" font-size="16" fill="#713f12">get_balance_sheet</text>
    <text x="845" y="231" font-size="16" fill="#713f12">get_cash_flow</text>
    <text x="845" y="259" font-size="16" fill="#713f12">search_filing</text>
    <text x="845" y="287" font-size="16" fill="#713f12">get_filing_document</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
