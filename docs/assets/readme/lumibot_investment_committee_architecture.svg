<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Lumibot AI Investment Committee Architecture</title>
  <desc id="desc">Read-only data tools feed evidence, bull and bear researchers debate, and a portfolio manager places Lumibot orders in backtests or live trading.</desc>
  <rect width="1400" height="520" fill="#f7fafc"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Lumibot AI Investment Committee</text>
  <text x="48" y="92" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4b5563">Research, debate, backtest, explain, and execute real Lumibot strategies.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="48" y="135" width="270" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="78" y="175" font-size="22" font-weight="700" fill="#111827">Read-only tools</text>
    <text x="78" y="215" font-size="17" fill="#334155">Market data</text>
    <text x="78" y="250" font-size="17" fill="#334155">Indicators</text>
    <text x="78" y="285" font-size="17" fill="#334155">SEC fundamentals</text>
    <text x="78" y="320" font-size="17" fill="#334155">SEC filings</text>
    <text x="78" y="355" font-size="17" fill="#334155">News</text>
    <path d="M330 260 H420" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="430" y="110" width="250" height="140" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="460" y="155" font-size="22" font-weight="700" fill="#0e7490">Evidence researcher</text>
    <text x="460" y="190" font-size="16" fill="#155e75">Builds source-backed</text>
    <text x="460" y="215" font-size="16" fill="#155e75">evidence packs</text>
    <path d="M690 180 H780" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="790" y="85" width="220" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="830" y="130" font-size="23" font-weight="700" fill="#15803d">Bull case</text>
    <text x="830" y="162" font-size="16" fill="#166534">Best long thesis</text>
    <rect x="790" y="255" width="220" height="120" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="830" y="300" font-size="23" font-weight="700" fill="#b91c1c">Bear case</text>
    <text x="830" y="332" font-size="16" fill="#991b1b">Risk and rebuttal</text>
    <path d="M1020 145 H1110" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1020 315 H1110" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1120" y="145" width="230" height="170" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="1150" y="190" font-size="22" font-weight="700" fill="#3730a3">Portfolio manager</text>
    <text x="1150" y="226" font-size="16" fill="#4338ca">Checks positions, cash,</text>
    <text x="1150" y="251" font-size="16" fill="#4338ca">risk limits, and orders</text>
    <path d="M1235 325 V405" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1085" y="410" width="300" height="70" rx="14" fill="#2563eb"/>
    <text x="1138" y="455" font-size="26" font-weight="700" fill="#ffffff">Lumibot execution</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
