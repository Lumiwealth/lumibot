name: LumiBot Agent Evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-evals:
    name: Real-Model Agent Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install qualified dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt -c requirements_agent_evals.txt
      - name: Verify native real-model actor and judge qualification
        run: timeout 120 python scripts/qualify_agent_evals.py verify
      - name: Upload compact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumibot-agent-evals-${{ github.run_id }}
          if-no-files-found: error
          path: ci/agent-evals/qualification.json
