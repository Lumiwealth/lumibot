name: Release (PyPI + GitHub)

on:
  push:
    tags:
      - "v*.*.*"

# Needed for:
# - PyPI Trusted Publisher (OIDC): id-token: write
# - Creating GitHub Releases: contents: write
permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  validate-build:
    name: Validate + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install build

      - name: Validate tag version matches setup.py
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "")
          if not tag.startswith("v"):
            raise SystemExit(f"Expected tag like vX.Y.Z, got {tag!r}")
          version = tag.removeprefix("v")

          setup_text = Path("setup.py").read_text(encoding="utf-8")
          m = re.search(r"version\s*=\s*['\"]([^'\"]+)['\"]", setup_text)
          setup_version = m.group(1) if m else None
          if setup_version != version:
            raise SystemExit(f"Tag version {version} != setup.py version {setup_version}")

          print(f"OK: tag={tag} setup.py={setup_version}")
          PY

      - name: Build package
        run: |
          set -euo pipefail
          python -m build --wheel

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*

  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Run unit tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "6"
          BACKTESTING_DATA_SOURCE: none
          BACKTESTING_SHOW_PROGRESS_BAR: "false"
          AIOHTTP_NO_EXTENSIONS: 1
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          THETADATA_USERNAME: ${{ secrets.THETADATA_USERNAME }}
          THETADATA_PASSWORD: ${{ secrets.THETADATA_PASSWORD }}
          DATADOWNLOADER_BASE_URL: ${{ secrets.DATADOWNLOADER_BASE_URL }}
          DATADOWNLOADER_API_KEY: ${{ secrets.DATADOWNLOADER_API_KEY }}
          ALPACA_TEST_API_KEY: ${{ secrets.ALPACA_TEST_API_KEY }}
          ALPACA_TEST_API_SECRET: ${{ secrets.ALPACA_TEST_API_SECRET }}
          TRADIER_TEST_ACCESS_TOKEN: ${{ secrets.TRADIER_TEST_ACCESS_TOKEN }}
          TRADIER_TEST_ACCOUNT_NUMBER: ${{ secrets.TRADIER_TEST_ACCOUNT_NUMBER }}
        run: |
          set -euo pipefail
          PYTEST_MARKERS='not apitest and not downloader'
          export PYTEST_MARKERS

          python - <<'PY'
          import os
          import subprocess
          import sys
          from collections import Counter

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_total = int(os.environ["SHARD_TOTAL"])
          markers = os.environ["PYTEST_MARKERS"]

          proc = subprocess.run(
              [
                  "pytest",
                  "tests/",
                  "--ignore=tests/backtest/",
                  "-m",
                  markers,
                  "--collect-only",
                  "-q",
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              sys.stdout.write(proc.stdout)
              sys.stderr.write(proc.stderr)
              raise SystemExit(proc.returncode)

          nodeids = [line.strip() for line in proc.stdout.splitlines() if "::" in line]
          counts = Counter(nodeid.split("::", 1)[0] for nodeid in nodeids)
          files = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
          bins = [{"count": 0, "files": []} for _ in range(shard_total)]
          for path, count in files:
              target = min(bins, key=lambda item: (item["count"], len(item["files"])))
              target["files"].append(path)
              target["count"] += count

          with open("shard_files.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(bins[shard_index]["files"]))
              handle.write("\n")

          print(
              f"selected_files={len(bins[shard_index]['files'])} "
              f"total_tests={bins[shard_index]['count']} "
              f"bins={[item['count'] for item in bins]}"
          )
          PY

          timeout 1500 python -m pytest -m "${PYTEST_MARKERS}" \
            --tb=short -q --durations=30 -x $(cat shard_files.txt)

  backtest-tests:
    name: Backtest Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Run backtest tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "4"
          BACKTESTING_DATA_SOURCE: none
          BACKTESTING_SHOW_PROGRESS_BAR: "false"
          AIOHTTP_NO_EXTENSIONS: 1
          THETADATA_USERNAME: ${{ secrets.THETADATA_USERNAME }}
          THETADATA_PASSWORD: ${{ secrets.THETADATA_PASSWORD }}
          DATADOWNLOADER_BASE_URL: ${{ secrets.DATADOWNLOADER_BASE_URL }}
          DATADOWNLOADER_API_KEY: ${{ secrets.DATADOWNLOADER_API_KEY }}
          LUMIBOT_CACHE_S3_BUCKET: ${{ secrets.LUMIBOT_CACHE_S3_BUCKET }}
          LUMIBOT_CACHE_S3_PREFIX: ${{ secrets.LUMIBOT_CACHE_S3_PREFIX }}
          LUMIBOT_CACHE_S3_REGION: ${{ secrets.LUMIBOT_CACHE_S3_REGION }}
          LUMIBOT_CACHE_S3_VERSION: ${{ secrets.LUMIBOT_CACHE_S3_VERSION }}
          LUMIBOT_CACHE_S3_ACCESS_KEY_ID: ${{ secrets.LUMIBOT_CACHE_S3_ACCESS_KEY_ID }}
          LUMIBOT_CACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.LUMIBOT_CACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          PYTEST_MARKERS='not apitest and not downloader'
          export PYTEST_MARKERS

          python - <<'PY'
          import os
          import subprocess
          import sys

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_total = int(os.environ["SHARD_TOTAL"])
          markers = os.environ["PYTEST_MARKERS"]

          proc = subprocess.run(
              [
                  "pytest",
                  "tests/backtest/",
                  "-m",
                  markers,
                  "--collect-only",
                  "-q",
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              sys.stdout.write(proc.stdout)
              sys.stderr.write(proc.stderr)
              raise SystemExit(proc.returncode)

          nodeids = [line.strip() for line in proc.stdout.splitlines() if "::" in line]
          bins = [[] for _ in range(shard_total)]
          for index, nodeid in enumerate(nodeids):
              bins[index % shard_total].append(nodeid)

          with open("shard_nodeids.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(bins[shard_index]))
              handle.write("\n")

          print(
              f"selected_nodeids={len(bins[shard_index])} "
              f"total_nodeids={len(nodeids)}"
          )
          PY

          timeout 1500 python -m pytest -m "${PYTEST_MARKERS}" \
            --tb=short -q --durations=30 -x $(cat shard_nodeids.txt)

  agent-evals:
    name: Real-Model Agent Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Restore passing eval freshness
        uses: actions/cache/restore@v4
        with:
          path: .ci/agent-evals/freshness.json
          key: lumibot-agent-evals-v1-${{ github.run_id }}
          restore-keys: |
            lumibot-agent-evals-v1-

      - name: Restore cross-workflow passing eval freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/restore_agent_eval_freshness.py \
            --repository "${GITHUB_REPOSITORY}" \
            --output .ci/agent-evals/freshness.json

      - name: Run stale real-model evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LUMIBOT_DISABLE_DOTENV: "1"
        run: |
          set -euo pipefail
          timeout 1500 python scripts/run_agent_evals.py \
            --gate \
            --repeat 3 \
            --max-workers 3 \
            --max-cost-usd 2 \
            --freshness-state .ci/agent-evals/freshness.json \
            --output-root .ci/agent-evals/artifacts

      - name: Save passing eval freshness
        uses: actions/cache/save@v4
        with:
          path: .ci/agent-evals/freshness.json
          key: lumibot-agent-evals-v1-${{ github.run_id }}

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumibot-agent-evals
          if-no-files-found: warn
          path: |
            .ci/agent-evals/artifacts/**
            .ci/agent-evals/freshness.json

  publish:
    name: Publish to PyPI + Create GitHub Release
    needs: [validate-build, unit-tests, backtest-tests, agent-evals]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional: configure this environment in GitHub settings to require approvals.
    environment: pypi
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Prefer API token publish. This avoids Trusted Publisher config drift.
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  start-next-version:
    name: Start next version branch
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version and create branch
        run: |
          set -euo pipefail

          # Extract current version from the tag that triggered this workflow
          TAG="${GITHUB_REF_NAME}"          # e.g. v4.4.57
          VERSION="${TAG#v}"                # e.g. 4.4.57

          # Compute next patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          BRANCH="version/${NEXT_VERSION}"

          echo "Current: ${VERSION} → Next: ${NEXT_VERSION} → Branch: ${BRANCH}"

          # Check if branch already exists (idempotent)
          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "Branch ${BRANCH} already exists — skipping."
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create the branch from dev
          git switch -c "${BRANCH}"

          # Bump setup.py
          sed -i "s/version=\"${VERSION}\"/version=\"${NEXT_VERSION}\"/" setup.py
          grep "version=" setup.py  # verify

          # Add changelog placeholder
          sed -i "s/^# Changelog$/# Changelog\n\n## ${NEXT_VERSION} - Unreleased/" CHANGELOG.md

          # Commit and push
          git add setup.py CHANGELOG.md
          git commit -m "chore: start ${NEXT_VERSION}"
          git push -u origin "${BRANCH}"

          echo "✅ Created ${BRANCH} with setup.py=${NEXT_VERSION}"
